# IntelliJ Platform Artifacts Repositories -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html
pluginGroup = com.flutterassetsgen
pluginName = Flutter Assets Generator (Modern)
# SemVer format -> https://semver.org
pluginVersion = 1.0.1

# See https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
# for insight into build numbers and IntelliJ Platform versions.
# 242 = 2024.2 (Android Studio Ladybug and newer). Left open-ended on the upper
# end so the plugin keeps working on newer Android Studio releases without a
# rebuild, unless a future platform API break requires capping it.
pluginSinceBuild = 261
pluginUntilBuild =

# IntelliJ Platform Properties -> https://plugins.jetbrains.com/docs/intellij/tools-intellij-platform-gradle-plugin-dependencies-extension.html
# The Android Studio version to compile/run against. Update this to match
# whichever Android Studio release you want to develop/test against; it does
# NOT limit which Android Studio versions can install the finished plugin
# (that is controlled by pluginSinceBuild/pluginUntilBuild above).
platformVersion = 2026.1.4.7

# Java language level used to compile sources - Java 17 is required by the
# IntelliJ Platform Gradle Plugin 2.x / current Android Studio.
javaVersion = 21

# Gradle Releases -> https://github.com/gradle/gradle/releases
# IntelliJ Platform Gradle Plugin 2.x requires Gradle 9.0+.
gradleVersion = 9.0

# Opt-out flag for bundling Kotlin standard library.
# See https://plugins.jetbrains.com/docs/intellij/kotlin.html#kotlin-standard-library for details.
kotlin.stdlib.default.dependency = false

org.gradle.caching = true
org.gradle.parallel = true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
